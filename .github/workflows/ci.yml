name: ci

on:
  push:
  pull_request:
  workflow_call: # proof.yml reuses this workflow so the proof run deploys the same build

permissions:
  contents: read

env:
  # Toolchain and builder for the contract wasm.
  # Source: cargo-near 0.23.0 (README "non-reproducible-wasm"; its project template pins
  # channel "1.95.0" with near-sdk "5.30.1") and near-sdk-rs 5.30.1 (README: MSRV 1.95.0).
  # cargo-near-build checks the compiler before building (build/mod.rs, max_allowed_rustc):
  # rustc 1.87+ emits bulk-memory and nontrapping-float-to-int opcodes, which the NEAR VM
  # accepts from protocol version 84; a near-sdk that declares min_protocol_version >= 84
  # has no rustc ceiling, an older one is held to rustc 1.86. near-sdk 5.30.1 declares 85
  # (near-sdk/Cargo.toml, [package.metadata.near]) and testnet runs protocol 88.
  # RUSTUP_TOOLCHAIN makes every cargo call below use this exact compiler.
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_NEAR_VERSION: "0.23.0"
  CARGO_TERM_COLOR: always

jobs:
  js:
    name: JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test (dependency-free JS)
        run: |
          shopt -s nullglob
          files=(web/*.test.mjs sim/*.test.mjs scripts/proof/*.test.mjs scripts/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no test files found"
            exit 0
          fi
          printf 'test file: %s\n' "${files[@]}"
          node --test "${files[@]}"

  compat:
    # web/chain.js encodes and signs transactions itself; this compares its bytes with
    # near-api-js, which is installed only here, with a read-only token.
    name: chain.js against near-api-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned client library
        working-directory: scripts/proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compare
        run: node --test scripts/proof/chain-compat.check.mjs
      - name: The pinned wallet connector still matches its SHA-384
        run: node --test scripts/proof/connector-pin.check.mjs

  contract:
    name: Contract tests and wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }} with the wasm target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            contracts/target
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_NEAR_VERSION }}-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_NEAR_VERSION }}-

      - name: cargo test (loud-math, loud)
        working-directory: contracts
        run: cargo test --workspace --locked

      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }}
        # Official release installer, pinned to one version.
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-near" --version

      - name: Build the contract wasm
        # --no-abi: the ABI is not used and would need schema derives on every type.
        working-directory: contracts/loud
        run: |
          rm -rf "$RUNNER_TEMP/near-out"
          cargo near build non-reproducible-wasm --locked --no-abi --out-dir "$RUNNER_TEMP/near-out"

      - name: Collect and check the wasm
        run: |
          mapfile -t found < <(find "$RUNNER_TEMP/near-out" -name '*.wasm')
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected exactly one wasm, found ${#found[@]}: ${found[*]}"
            exit 1
          fi
          mkdir -p build
          cp "${found[0]}" build/loud.wasm
          size=$(stat -c %s build/loud.wasm)
          echo "loud.wasm: ${size} bytes, sha256 $(sha256sum build/loud.wasm | cut -d' ' -f1)"
          # A transaction must stay under about 1.5 MB, and the deploy travels in one.
          if [ "$size" -lt 10000 ] || [ "$size" -gt 1300000 ]; then
            echo "unexpected wasm size"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: contracts/Cargo.lock
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: loud-wasm
          path: build/loud.wasm
          if-no-files-found: error
          retention-days: 30
