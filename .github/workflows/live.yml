name: live

# Deploys the token the page's live section uses to NEAR testnet and commits
# web/live.json. Manual trigger only. No secrets: every key is generated inside the job
# and kept in memory.
#
# The live preset keeps the launch window open for 7 days, the longest the contract
# takes, so that every buy made from the page in that time is loud. The full proof run
# (proof.yml) cannot use it: its late-buyer check needs the window to close.
#
# The jobs that install or run npm code (compat, deploy) have a read-only token. Only the
# record jobs can write to the repository, and they run no npm code. The e2e job walks
# the visitor's path on chain with web/chain.js, the code the page itself runs, with a
# read-only token too; it hands web/live-e2e.json to record-e2e as an artifact.

# A manual run needs this file on the default branch. On a work branch the same run is
# started by a push that changes .github/live-trigger: its first word is `deploy` (deploy
# and walk the path) or `e2e` (only walk the path against the committed web/live.json).

on:
  push:
    branches-ignore: [main]
    paths: [".github/live-trigger"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy a new live token (off: only run the end-to-end check against web/live.json)"
        type: boolean
        default: true
      e2e:
        description: "Walk the visitor's path on chain after the deploy"
        type: boolean
        default: true
      record_failure:
        description: "Commit web/live-e2e.json also when the walk stops at a step that did not hold"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  plan:
    name: What to run
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_DEPLOY: ${{ inputs.deploy }}
          IN_E2E: ${{ inputs.e2e }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            deploy="$IN_DEPLOY"; e2e="$IN_E2E"
          else
            word="$(head -c 32 .github/live-trigger | tr -cd 'a-z0-9' )"
            case "$word" in
              deploy*) deploy=true; e2e=true ;;
              e2e*) deploy=false; e2e=true ;;
              *) deploy=false; e2e=false ;;
            esac
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy e2e=$e2e"

  compat:
    # The page's own transaction encoding and signing against near-api-js, byte for byte,
    # before anything is signed on chain. Runs for a deploy and for an e2e walk alone.
    name: Check web/chain.js against near-api-js
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' || needs.plan.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned client library
        working-directory: scripts/proof
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compare
        run: node --test scripts/proof/chain-compat.check.mjs

  build:
    # Same tests and the same wasm build as CI; uploads the artifact loud-wasm.
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy the live token
    needs: [plan, compat, build]
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: loud-wasm
          path: build

      - name: Install the pinned client library
        working-directory: scripts/proof
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy
        env:
          MODE: deploy
          PRESET: live
          LOUD_WASM: ${{ github.workspace }}/build/loud.wasm
        run: node scripts/proof/proof.mjs

      - name: Upload the result file
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-result
          path: web/live.json
          if-no-files-found: error
          retention-days: 7

  record:
    name: Commit web/live.json
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: live-result
          path: web

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/live.json
          if git diff --cached --quiet; then
            echo "web/live.json unchanged"
            exit 0
          fi
          git commit -m "chore(live): record live token deploy ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  e2e:
    name: Visitor path on chain
    needs: [plan, compat, record]
    # Runs after a recorded deploy, or alone against the committed web/live.json, and only
    # once the encoding check has passed.
    if: ${{ always() && needs.plan.outputs.e2e == 'true' && needs.compat.result == 'success' && (needs.record.result == 'success' || (needs.record.result == 'skipped' && needs.plan.outputs.deploy != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install: web/chain.js and this script have no dependency.
      - name: Walk the visitor's path
        id: walk
        run: node scripts/live-e2e.mjs

      # The walk writes its record also when it stops at a step that did not hold.
      - name: Upload the record of the walk
        if: ${{ always() && hashFiles('web/live-e2e.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e
          path: web/live-e2e.json
          if-no-files-found: error
          retention-days: 7

  record-e2e:
    name: Commit web/live-e2e.json
    needs: e2e
    # A walk that passed is committed. One that stopped is committed only on request; its
    # record is in the run's artifact either way.
    if: ${{ always() && (needs.e2e.result == 'success' || (needs.e2e.result == 'failure' && inputs.record_failure)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: live-e2e
          path: web

      - name: Commit
        env:
          STATUS: ${{ needs.e2e.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/live-e2e.json
          if git diff --cached --quiet; then
            echo "web/live-e2e.json unchanged"
            exit 0
          fi
          git commit -m "chore(live): record visitor path walk ${GITHUB_RUN_ID} (${STATUS})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
